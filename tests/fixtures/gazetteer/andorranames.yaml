name: andorranames
crs: EPSG:4326

sources:
  - name: AD
    path: data/AD.txt
    file: AD.txt
    delimiter: "\t"
    quote: ""
    attributes:
      - name: "geonameid"
        type: integer
      - name: "name"
        type: text
      - name: "asciiname"
        type: text
      - name: "alternatenames"
        type: text
      - name: "latitude"
        type: real
      - name: "longitude"
        type: real
      - name: "feature_class"
        type: text
      - name: "feature_code"
        type: text
      - name: "country_code"
        type: text
      - name: "cc2"
        type: text
      - name: "admin1_code"
        type: text
      - name: "admin2_code"
        type: text
      - name: "admin3_code"
        type: text
      - name: "admin4_code"
        type: text
      - name: "population"
        type: integer
      - name: "elevation"
        type: integer
      - name: "dem"
        type: integer
      - name: "timezone"
        type: text
      - name: "modification_date"
        type: text

  - name: admin1CodesASCII
    path: data/admin1CodesASCII.txt
    file: admin1CodesASCII.txt
    delimiter: "\t"
    quote: ""
    attributes:
      - name: "code"
        type: text
      - name: "name"
        type: text
      - name: "asciiname"
        type: text
      - name: "geonameid"
        type: integer

  - name: admin2Codes
    path: data/admin2Codes.txt
    file: admin2Codes.txt
    delimiter: "\t"
    quote: ""
    attributes:
      - name: "code"
        type: text
      - name: "name"
        type: text
      - name: "asciiname"
        type: text
      - name: "geonameid"
        type: integer

  - name: countryInfo
    path: data/countryInfo.txt
    file: countryInfo.txt
    delimiter: "\t"
    quote: ""
    skip_rows: 50
    attributes:
      - name: "ISO"
        type: text
      - name: "ISO3"
        type: text
      - name: "ISO_Numeric"
        type: integer
      - name: "fips"
        type: text
      - name: "Country"
        type: text
      - name: "Capital"
        type: text
      - name: "Area"
        type: real
      - name: "Population"
        type: integer
      - name: "Continent"
        type: text
      - name: "tld"
        type: text
      - name: "CurrencyCode"
        type: text
      - name: "CurrencyName"
        type: text
      - name: "Phone"
        type: text
      - name: "PostalCodeFormat"
        type: text
      - name: "PostalCodeRegex"
        type: text
      - name: "Languages"
        type: text
      - name: "geonameid"
        type: integer
      - name: "neighbours"
        type: text
      - name: "EquivalentFipsCode"
        type: text

  - name: featureCodes_en
    path: data/featureCodes_en.txt
    file: featureCodes_en.txt
    delimiter: "\t"
    quote: ""
    attributes:
      - name: "code"
        type: text
      - name: "name"
        type: text
      - name: "description"
        type: text

  - name: shape
    path: data/shape.shp
    file: AD.shp
    attributes:
      - name: "OGC_FID"
        type: integer
      - name: "geometry"
        type: geometry

features:
  - source: AD
    joins:
      - "LEFT JOIN countryInfo ON country_code = countryInfo.ISO"
      - "LEFT JOIN admin1CodesASCII ON country_code || '.' || admin1_code = admin1CodesASCII.code"
      - "LEFT JOIN admin2Codes ON country_code || '.' || admin1_code || '.' || admin2_code = admin2Codes.code"
      - "LEFT JOIN featureCodes_en ON feature_class || '.' || feature_code = featureCodes_en.code"
      - "LEFT JOIN shape ON ST_Within(ST_Point(longitude, latitude), shape.geometry)"
    identifier: "geonameid"
    geometry: "ST_Point(longitude, latitude)"
    names:
      - "name"
      - "CASE WHEN instr(name, '(') > 0 THEN trim(substr(name, 1, instr(name, '(') - 1)) ELSE name END"
      - "asciiname"
      - "unnest(string_split(alternatenames, ','))"
    data:
      - "name"
      - "asciiname"
      - "latitude"
      - "longitude"
      - "feature_class"
      - "feature_code"
      - "featureCodes_en.name AS feature_name"
      - "country_code"
      - "countryInfo.Country AS country_name"
      - "admin1_code"
      - "admin1CodesASCII.name AS admin1_name"
      - "admin2_code"
      - "admin2Codes.name AS admin2_name"
      - "population"
      - "elevation"
      - "dem"
      - "timezone"
      - "shape.OGC_FID AS shape_fid"
