# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_create_environment:
      # uv installs into the environment Read the Docs already created, so the
      # docs build uses exactly the versions pinned in uv.lock.
      - pip install uv
    post_install:
      # Runtime dependencies are needed because autodoc imports geoparser from the
      # source tree; the project package itself is not installed, matching the
      # previous `poetry install --no-root`.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --locked --no-install-project --no-default-groups --group docs

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
