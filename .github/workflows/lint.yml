name: Lint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      # Only the lint group, so this job stays at a few seconds; a full
      # `uv sync` would pull torch and the CUDA stack. Ruff's version is
      # pinned in pyproject.toml and locked in uv.lock, so CI and a
      # contributor's machine format identically.
      - name: Install lint tools
        run: uv sync --locked --only-group lint

      - name: ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: ruff format
        run: uv run --no-sync ruff format --check --diff .
