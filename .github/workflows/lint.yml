name: Lint

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Versions mirror the dev dependencies resolved in poetry.lock. Installing
      # the three tools directly keeps this job at a few seconds; a full
      # `poetry install` would pull torch and the CUDA stack.
      - name: Install lint tools
        run: pip install black==25.11.0 isort==7.0.0 autoflake==2.3.3

      - name: black
        run: black --check --diff .

      - name: isort
        run: isort --check-only --diff .

      - name: autoflake
        run: autoflake --check --remove-all-unused-imports --recursive --exclude '__init__.py' .
