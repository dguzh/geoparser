name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Mutation testing is the one check too slow to sit in front of a merge: a
  # cold run spends ~40 minutes mapping tests to code before it mutates
  # anything. It runs nightly instead, and on demand.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The most surviving mutants tolerated. Measured on this tree: 1999 mutants,
  # 1787 killed, 0 survived, 212 with no covering unit test -- a 100% mutation
  # score over judged mutants at about 25.1 mutants/second. This is a ratchet:
  # keep it at zero. A new survivor means a line the unit suite runs but does
  # not check, so the fix is the test, not the threshold.
  MAX_SURVIVING_MUTANTS: "0"

jobs:
  # Type checking needs the dependencies installed, or every third-party import
  # is unresolved, so it cannot join the fast Ruff job.
  ty:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android

      - name: Install project dependencies
        run: uv sync --locked

      - name: ty
        run: uv run --no-sync ty check

  mutation:
    # Nightly and on demand only; the pull request gates are ruff, ty, the
    # test matrix, coverage and CRAP, which together finish in minutes.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A cold run maps every test to the code it reaches before it mutates
    # anything, and that mapping pass dominates. Warm runs restore the
    # mutants/ cache below and only re-test what changed.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # mutmut's change detection compares against history.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android

      - name: Install project dependencies
        run: uv sync --locked

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      # mutmut caches each mutant's verdict under mutants/ and re-tests only
      # what changed, so restoring the previous run turns a pull request into
      # an incremental check rather than a full sweep. The cache is keyed by
      # commit and falls back to the most recent run on this branch or main.
      - name: Cache mutation results
        uses: actions/cache@v6
        with:
          path: mutants
          key: mutmut-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            mutmut-${{ runner.os }}-

      # Scoped by [tool.mutmut] in pyproject.toml: the library is mutated and
      # judged by the unit suite.
      - name: Run mutation testing
        run: uv run --no-sync mutmut run

      - name: Export mutation stats
        run: uv run --no-sync mutmut export-cicd-stats

      - name: Enforce the mutation baseline
        run: uv run --no-sync python scripts/mutation_gate.py --max-survivors ${{ env.MAX_SURVIVING_MUTANTS }}

      - name: Mutation results
        if: always()
        run: uv run --no-sync mutmut results
