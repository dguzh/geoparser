[project]
name = "geoparser"
version = "0.6.0"
description = "A customizable geoparsing library for unstructured text"
authors = [{ name = "Diego Gomes", email = "diego.gomes@uzh.ch" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = [
    "accelerate>=1.11.0,<2",
    "appdirs>=1.4.4,<2",
    "datasets>=5.0.0,<6",
    "duckdb>=1.5.4,<2",
    "fastapi>=0.121.0,<0.122",
    "markupsafe>=3.0.3,<4",
    "pydantic>=2.12.3,<3",
    "pyproj>=3.7.1,<4",
    "python-multipart>=0.0.20,<0.0.21",
    "pyyaml>=6.0.3,<7",
    "rapidfuzz>=3.14.5,<4",
    "requests>=2.32.5,<3",
    "rich>=15.0.0,<16",
    "gliner2[local]>=2.0.0,<3",
    "peft>=0.15.2,<1",
    # GLiNER2's tokenizer is a sentencepiece model, which transformers can only
    # convert to its fast tokenizer with protobuf available. Without these the
    # recognizer fails at load time, not at import.
    "protobuf>=6.33.1,<8",
    "sentence-transformers>=5.1.2,<6",
    "sentencepiece>=0.2.1,<1",
    "shapely>=2.1.2,<3",
    # 3.8.14 has cp314 wheels on GitHub but not on PyPI (explosion/spaCy#13949)
    "spacy>=3.8.7,<4,!=3.8.14",
    "sqlalchemy>=2.0.44,<3",
    "sqlmodel>=0.0.39,<0.0.40",
    "torch>=2.9.0,<3",
    # gliner2 requires transformers<5 (its modelling code predates the 5.x
    # API); jina-embeddings-v5 needs >=4.57. That window is the intersection.
    "transformers>=4.57.0,<5",
    "typer>=0.27.0,<0.28",
    "uvicorn>=0.38.0,<0.39",
    "werkzeug>=3.1.3,<4",
]

[project.urls]
Homepage = "https://geoparser.app"
Repository = "https://github.com/dguzh/geoparser"

[dependency-groups]
# Everything needed to develop, test and document the project. `uv sync`
# installs this group by default, so a bare clone is one command from a
# working environment.
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "docs" },
    "deptry>=0.23.1,<0.24",
    "jupyter>=1.1.1,<2",
    "plotly>=6.0.0,<7",
]
# Kept separate so CI can install the linters without pulling torch and the
# CUDA stack; this is what keeps the lint job at a few seconds.
lint = [
    "ruff==0.16.6",
    "ty==0.0.78",
    # radon + coverage are what scripts/crap.py needs to combine complexity
    # with coverage; coverage also backs the combined report in CI.
    "radon>=6.0.1,<7",
    "coverage[toml]>=7.0,<8",
]
test = [
    "pytest>=8.4.2,<10",
    "pytest-cov>=7.0.0,<8",
    "hypothesis>=6.140.0,<7",
    "pytest-bdd>=8.1.0,<9",
    "tomli>=2.0.1,<3; python_version < \"3.11\"",
    "requests-mock>=1.12.1,<2",
    "mutmut>=3.7.0,<4",
    "en-core-web-sm",
    "xx-sent-ud-sm",
]
docs = [
    "mkdocs-material>=9.6.0,<10",
    "mkdocstrings[python]>=0.29.0,<1",
]

# spaCy models are not on PyPI; they are published as GitHub release artifacts.
[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0.tar.gz" }
xx-sent-ud-sm = { url = "https://github.com/explosion/spacy-models/releases/download/xx_sent_ud_sm-3.8.0/xx_sent_ud_sm-3.8.0.tar.gz" }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geoparser"]

[tool.hatch.build.targets.sdist]
include = ["geoparser", "LICENSE", "README.md", "ROADMAP.md"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["docs/_build"]

[tool.ruff.lint]
# E/W/F are the pyflakes+pycodestyle baseline black and autoflake used to cover
# (F401 replaces autoflake's unused-import pass); I replaces isort; the rest are
# the low-noise correctness and modernization rules worth enforcing here.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Formatter owns line length; long strings and comments are not worth churning.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Re-exports are the point of these files.
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["geoparser"]

[tool.pytest.ini_options]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = ["tests"]
markers = [
    "unit: Fast, isolated unit tests with mocked dependencies",
    "integration: Integration tests with real models and database",
    "e2e: End-to-end pipeline tests",
    "property: Property-based tests over generated inputs",
    "acceptance: Executable user-facing acceptance scenarios",
    "architecture: Automated import and dependency-boundary checks",
]
addopts = [
    "--strict-markers",
    "--cov=geoparser",
    "--cov-report=term-missing",
    "--cov-config=pyproject.toml",
]
console_output_style = "progress"

[tool.mutmut]
# Mutation testing: mutmut edits the source in small ways and re-runs the
# tests; a mutant that survives is a line the suite does not really check.
source_paths = ["geoparser"]
# The annotator is a server-rendered UI that coverage also omits, and the CLI
# layer is argument wiring around code that is mutated on its own. Everything
# the library actually computes -- geoparser, gazetteer, services, modules, db
# -- is mutated.
do_not_mutate = [
    "geoparser/annotator/*",
    "geoparser/cli/*",
    # The build pipeline assembles SQL and drives duckdb; the unit suite mocks
    # that away, so its mutants can only be judged by the integration suite,
    # which rebuilds a real gazetteer per mutant (~23s each, ~13h for the
    # package). It is covered instead by those integration tests and by the
    # 100% coverage gate. Mutation testing stays where it is cheap to run
    # often, and is expected to leave no survivor there.
    "geoparser/gazetteer/build/*",
]
# Mutants are judged by the unit suite. Adding the integration suite was
# measured: it does remove every "no tests" mutant and cuts survival from 29%
# to about 11%, but each mutant it reaches then rebuilds a real gazetteer --
# roughly 23 seconds per mutant, some thirteen hours for the package. The
# integration and e2e suites plus the 100% coverage gate cover that code
# instead; mutation testing stays where it is cheap enough to run often.
pytest_add_cli_args_test_selection = ["tests/unit"]
# Coverage instrumentation is pure overhead here, and is re-collected per
# mutant otherwise.
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
# mutmut runs the suite from a copied tree; the schema tests validate the
# example config that the gazetteers guide walks through, so it has to come
# along or every mutant "fails" for want of a file.
also_copy = [
    "docs",
    "scripts",
    ".github",
    ".dockerignore",
    "CITATION.cff",
    "Dockerfile",
    "mkdocs.yml",
]

[tool.coverage.report]
exclude_also = [
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(t\\.|typing\\.)?overload",
    "if t.TYPE_CHECKING:",
    ]

[tool.coverage.run]
# sys.monitoring instead of the sys.settrace tracer: ~20% off the measured
# runs, with byte-identical results. Coverage falls back to the default core
# on Python 3.10/3.11, where sys.monitoring does not exist, and the warning
# about doing so is silenced because that fallback is expected here.
core = "sysmon"
disable_warnings = ["no-sysmon"]
source = ["geoparser"]
omit = [
    "tests/*",
    "geoparser/annotator/*",
]
relative_files = true

[tool.coverage.paths]
source = [
    'geoparser/',
    'geoparser\',
]

[tool.ty.src]
include = ["geoparser"]
