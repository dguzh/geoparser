site_name: Irchel Geoparser
site_url: https://docs.geoparser.app/
repo_name: NoeFlandre/geoparser
repo_url: https://github.com/NoeFlandre/geoparser
edit_uri: edit/main/docs/
use_directory_urls: false
strict: true
exclude_docs: |
  superpowers/plans/**

theme:
  name: material
  logo: _static/logo.png
  favicon: _static/favicon.ico
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            allow_inspection: true
            annotations_path: brief
            docstring_section_style: table
            docstring_style: google
            docstring_options:
              warn_missing_types: false
              warn_unknown_params: false
            force_inspection: true
            members_order: source
            separate_signature: true
            show_object_full_path: false
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Concepts: concepts.md
      - Demo: demo.md
  - User Guides:
      - Working with Results: guides/results.md
      - Configuring Modules: guides/modules.md
      - Gazetteers: guides/gazetteers.md
      - Custom Gazetteers: guides/custom-gazetteers.md
      - Managing Projects: guides/projects.md
      - Annotating Data: guides/annotating.md
      - Training Modules: guides/training.md
      - Offline Model Pilot: guides/model-pilot.md
  - API Reference:
      - Geoparser: api/geoparser.md
      - Project: api/project.md
      - Models: api/models.md
      - Modules: api/modules.md
      - Gazetteer: api/gazetteer.md
  - Development:
      - Development Guide: development.md
      - Architecture: architecture.md
      - Data and Models: data-and-models.md
      - Technical Debt: technical-debt.md
      - Architecture Decision Records:
          - Quality Gates and MkDocs: decisions/0001-quality-gates-and-mkdocs.md
          - CPU-only Linux Containers: decisions/0002-linux-container-cpu-pytorch.md
          - Resource-bounded Real-model Pilot: decisions/0003-real-model-pilot-boundary.md
