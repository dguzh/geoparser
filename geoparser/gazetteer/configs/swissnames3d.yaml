name: swissnames3d
crs: EPSG:4326

inputs:
  - name: pkt
    url: https://data.geo.admin.ch/ch.swisstopo.swissnames3d/swissnames3d_2024/swissnames3d_2024_2056.shp.zip
    file: swissNAMES3D_PKT.shp
    crs: EPSG:2056
  - name: lin
    url: https://data.geo.admin.ch/ch.swisstopo.swissnames3d/swissnames3d_2024/swissnames3d_2024_2056.shp.zip
    file: swissNAMES3D_LIN.shp
    crs: EPSG:2056
  - name: ply
    url: https://data.geo.admin.ch/ch.swisstopo.swissnames3d/swissnames3d_2024/swissnames3d_2024_2056.shp.zip
    file: swissNAMES3D_PLY.shp
    crs: EPSG:2056
  - name: gemeinde
    url: https://data.geo.admin.ch/ch.swisstopo.swissboundaries3d/swissboundaries3d_2024-01/swissboundaries3d_2024-01_2056_5728.shp.zip
    file: swissBOUNDARIES3D_1_5_TLM_HOHEITSGEBIET.shp
    crs: EPSG:2056
  - name: bezirk
    url: https://data.geo.admin.ch/ch.swisstopo.swissboundaries3d/swissboundaries3d_2024-01/swissboundaries3d_2024-01_2056_5728.shp.zip
    file: swissBOUNDARIES3D_1_5_TLM_BEZIRKSGEBIET.shp
    crs: EPSG:2056
  - name: kanton
    url: https://data.geo.admin.ch/ch.swisstopo.swissboundaries3d/swissboundaries3d_2024-01/swissboundaries3d_2024-01_2056_5728.shp.zip
    file: swissBOUNDARIES3D_1_5_TLM_KANTONSGEBIET.shp
    crs: EPSG:2056

# The administrative hierarchy is defined once and reused by all feature
# blocks. The spatial match uses the feature geometry's centroid, which for
# point features is the point itself.
lookups:
  in_gemeinde:
    from: gemeinde
    match: { spatial: within, using: centroid }
    values:
      GEMEINDE_NAME: NAME
      GEMEINDE_BFS_NUMMER: BFS_NUMMER
      BEZIRKSNUM: BEZIRKSNUM
  in_bezirk:
    from: bezirk
    match: { on: { BEZIRKSNUM: BEZIRKSNUM } }
    values:
      BEZIRK_NAME: NAME
      KANTONSNUM: KANTONSNUM
  in_kanton:
    from: kanton
    match: { on: { KANTONSNUM: KANTONSNUM } }
    values:
      KANTON_NAME: NAME

features:
  - type: named_place
    from: pkt
    identifier: UUID
    merge: { geometry: union, attributes: first }
    names:
      - column: NAME
      - expression: "CASE WHEN instr(NAME, '(') > 0 THEN trim(substr(NAME, 1, instr(NAME, '(') - 1)) ELSE NAME END"
      - expression: "CASE WHEN length(NAME) > 3 AND substr(NAME, -3, 1) = ' ' AND regexp_matches(substr(NAME, -2, 2), '^[A-Z][A-Z]$') THEN trim(substr(NAME, 1, length(NAME) - 3)) ELSE NAME END"
    geometry: { column: geometry }
    lookups: [in_gemeinde, in_bezirk, in_kanton]
    attributes:
      - NAME
      - OBJEKTART
      - OBJEKTKLAS
      - HOEHE
      - GEBAEUDENU
      - NAME_UUID
      - STATUS
      - SPRACHCODE
      - NAMEN_TYP
      - NAMENGRUPP
      - GEMEINDE_NAME
      - GEMEINDE_BFS_NUMMER
      - BEZIRK_NAME
      - BEZIRKSNUM
      - KANTON_NAME
      - KANTONSNUM

  - type: named_way
    from: lin
    identifier: UUID
    merge: { geometry: union, attributes: first }
    names:
      - column: NAME
      - expression: "CASE WHEN instr(NAME, '(') > 0 THEN trim(substr(NAME, 1, instr(NAME, '(') - 1)) ELSE NAME END"
      - expression: "CASE WHEN length(NAME) > 3 AND substr(NAME, -3, 1) = ' ' AND regexp_matches(substr(NAME, -2, 2), '^[A-Z][A-Z]$') THEN trim(substr(NAME, 1, length(NAME) - 3)) ELSE NAME END"
    geometry: { column: geometry }
    lookups: [in_gemeinde, in_bezirk, in_kanton]
    attributes:
      - NAME
      - OBJEKTART
      - OBJEKTKLAS
      - KUNSTBAUTE
      - NAME_UUID
      - STATUS
      - SPRACHCODE
      - NAMEN_TYP
      - NAMENGRUPP
      - GEMEINDE_NAME
      - GEMEINDE_BFS_NUMMER
      - BEZIRK_NAME
      - BEZIRKSNUM
      - KANTON_NAME
      - KANTONSNUM

  - type: named_area
    from: ply
    identifier: UUID
    merge: { geometry: union, attributes: first }
    names:
      - column: NAME
      - expression: "CASE WHEN instr(NAME, '(') > 0 THEN trim(substr(NAME, 1, instr(NAME, '(') - 1)) ELSE NAME END"
      - expression: "CASE WHEN length(NAME) > 3 AND substr(NAME, -3, 1) = ' ' AND regexp_matches(substr(NAME, -2, 2), '^[A-Z][A-Z]$') THEN trim(substr(NAME, 1, length(NAME) - 3)) ELSE NAME END"
    geometry: { column: geometry }
    lookups: [in_gemeinde, in_bezirk, in_kanton]
    attributes:
      - NAME
      - OBJEKTART
      - OBJEKTKLAS
      - EINWOHNERK
      - ISCED
      - NAME_UUID
      - STATUS
      - SPRACHCODE
      - NAMEN_TYP
      - NAMENGRUPP
      - GEMEINDE_NAME
      - GEMEINDE_BFS_NUMMER
      - BEZIRK_NAME
      - BEZIRKSNUM
      - KANTON_NAME
      - KANTONSNUM

  - type: gemeinde
    from: gemeinde
    identifier: UUID
    merge: { geometry: union, attributes: first }
    names:
      - column: NAME
      - expression: "CASE WHEN instr(NAME, '(') > 0 THEN trim(substr(NAME, 1, instr(NAME, '(') - 1)) ELSE NAME END"
    geometry: { column: geometry }
    lookups: [in_bezirk, in_kanton]
    attributes:
      - NAME
      - OBJEKTART
      - { name: GEMEINDE_NAME, column: NAME }
      - { name: GEMEINDE_BFS_NUMMER, column: BFS_NUMMER }
      - BEZIRK_NAME
      - BEZIRKSNUM
      - KANTON_NAME
      - KANTONSNUM
      - GEM_FLAECH
      - SEE_FLAECH
      - ICC
      - SHN
      - EINWOHNERZ

  - type: bezirk
    from: bezirk
    identifier: UUID
    merge: { geometry: union, attributes: first }
    names:
      - column: NAME
      - expression: "CASE WHEN instr(NAME, '(') > 0 THEN trim(substr(NAME, 1, instr(NAME, '(') - 1)) ELSE NAME END"
    geometry: { column: geometry }
    lookups: [in_kanton]
    attributes:
      - NAME
      - OBJEKTART
      - { name: BEZIRK_NAME, column: NAME }
      - BEZIRKSNUM
      - KANTON_NAME
      - KANTONSNUM
      - BEZIRKSFLA
      - SEE_FLAECH
      - ICC
      - EINWOHNERZ

  - type: kanton
    from: kanton
    identifier: UUID
    merge: { geometry: union, attributes: first }
    names:
      - column: NAME
    geometry: { column: geometry }
    attributes:
      - NAME
      - OBJEKTART
      - { name: KANTON_NAME, column: NAME }
      - KANTONSNUM
      - KANTONSFLA
      - SEE_FLAECH
      - ICC
      - EINWOHNERZ
