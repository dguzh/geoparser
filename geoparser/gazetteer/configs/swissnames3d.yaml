features:
  - source: swissNAMES3D_PKT
    joins:
      - "LEFT JOIN swissBOUNDARIES3D_1_5_TLM_HOHEITSGEBIET g ON ST_Within(ST_Centroid(geometry), g.geometry)"
      - "LEFT JOIN swissBOUNDARIES3D_1_5_TLM_BEZIRKSGEBIET b ON g.BEZIRKSNUM = b.BEZIRKSNUM"
      - "LEFT JOIN swissBOUNDARIES3D_1_5_TLM_KANTONSGEBIET k ON b.KANTONSNUM = k.KANTONSNUM"
    identifier: "UUID"
    geometry: "geometry"
    names:
      - "NAME"
      - "CASE WHEN instr(NAME, '(') > 0 THEN trim(substr(NAME, 1, instr(NAME, '(') - 1)) ELSE NAME END"
      - "CASE WHEN length(NAME) > 3 AND substr(NAME, -3, 1) = ' ' AND regexp_matches(substr(NAME, -2, 2), '^[A-Z][A-Z]$') THEN trim(substr(NAME, 1, length(NAME) - 3)) ELSE NAME END"
    data:
      - "NAME"
      - "OBJEKTART"
      - "OBJEKTKLAS"
      - "HOEHE"
      - "GEBAEUDENU"
      - "NAME_UUID"
      - "STATUS"
      - "SPRACHCODE"
      - "NAMEN_TYP"
      - "NAMENGRUPP"
      - "g.NAME AS GEMEINDE_NAME"
      - "g.BFS_NUMMER AS GEMEINDE_BFS_NUMMER"
      - "b.NAME AS BEZIRK_NAME"
      - "g.BEZIRKSNUM"
      - "k.NAME AS KANTON_NAME"
      - "b.KANTONSNUM"

