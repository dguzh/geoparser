name: geonames
crs: EPSG:4326

inputs:
  - name: allCountries
    url: https://download.geonames.org/export/dump/allCountries.zip
    file: allCountries.txt
    delimiter: "\t"
    quote: ""
    columns:
      - { name: geonameid, type: integer }
      - { name: name }
      - { name: asciiname }
      - { name: alternatenames }
      - { name: latitude, type: real }
      - { name: longitude, type: real }
      - { name: feature_class }
      - { name: feature_code }
      - { name: country_code }
      - { name: cc2 }
      - { name: admin1_code }
      - { name: admin2_code }
      - { name: admin3_code }
      - { name: admin4_code }
      - { name: population, type: integer }
      - { name: elevation, type: integer }
      - { name: dem, type: integer }
      - { name: timezone }
      - { name: modification_date }

  - name: admin1CodesASCII
    url: https://download.geonames.org/export/dump/admin1CodesASCII.txt
    file: admin1CodesASCII.txt
    delimiter: "\t"
    quote: ""
    columns:
      - { name: code }
      - { name: name }
      - { name: asciiname }
      - { name: geonameid, type: integer }

  - name: admin2Codes
    url: https://download.geonames.org/export/dump/admin2Codes.txt
    file: admin2Codes.txt
    delimiter: "\t"
    quote: ""
    columns:
      - { name: code }
      - { name: name }
      - { name: asciiname }
      - { name: geonameid, type: integer }

  - name: countryInfo
    url: https://download.geonames.org/export/dump/countryInfo.txt
    file: countryInfo.txt
    delimiter: "\t"
    quote: ""
    skip_rows: 50
    columns:
      - { name: ISO }
      - { name: ISO3 }
      - { name: ISO_Numeric, type: integer }
      - { name: fips }
      - { name: Country }
      - { name: Capital }
      - { name: Area, type: real }
      - { name: Population, type: integer }
      - { name: Continent }
      - { name: tld }
      - { name: CurrencyCode }
      - { name: CurrencyName }
      - { name: Phone }
      - { name: PostalCodeFormat }
      - { name: PostalCodeRegex }
      - { name: Languages }
      - { name: geonameid, type: integer }
      - { name: neighbours }
      - { name: EquivalentFipsCode }

  - name: featureCodes
    url: https://download.geonames.org/export/dump/featureCodes_en.txt
    file: featureCodes_en.txt
    delimiter: "\t"
    quote: ""
    columns:
      - { name: code }
      - { name: name }
      - { name: description }

lookups:
  country:
    from: countryInfo
    match: { on: { country_code: ISO } }
    values: { country_name: Country }
  admin1:
    from: admin1CodesASCII
    match: { on: { "country_code || '.' || admin1_code": code } }
    values: { admin1_name: name }
  admin2:
    from: admin2Codes
    match:
      on: { "country_code || '.' || admin1_code || '.' || admin2_code": code }
    values: { admin2_name: name }
  feature_codes:
    from: featureCodes
    match: { on: { "feature_class || '.' || feature_code": code } }
    values: { feature_name: name }

features:
  - type: place
    from: allCountries
    identifier: geonameid
    names:
      - column: name
      - expression: "CASE WHEN instr(name, '(') > 0 THEN trim(substr(name, 1, instr(name, '(') - 1)) ELSE name END"
      - column: asciiname
      - expression: "CASE WHEN instr(asciiname, '(') > 0 THEN trim(substr(asciiname, 1, instr(asciiname, '(') - 1)) ELSE asciiname END"
      - column: alternatenames
        split: ","
    geometry:
      point: { lon: longitude, lat: latitude }
    lookups: [country, admin1, admin2, feature_codes]
    attributes:
      - name
      - asciiname
      - latitude
      - longitude
      - feature_class
      - feature_code
      - feature_name
      - country_code
      - country_name
      - cc2
      - admin1_code
      - admin1_name
      - admin2_code
      - admin2_name
      - admin3_code
      - admin4_code
      - population
      - elevation
      - dem
      - timezone
      - modification_date
